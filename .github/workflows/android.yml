name: APK Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires (décodage GT7, tours, carburant, ingénieur)
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Diagnose public race HTML structure
        run: |
          python3 - <<'PY'
          import urllib.request, re, html
          for site in ["https://www.dg-edge.com/events/dailies", "https://victorydash.io/daily-races"]:
              try:
                  req=urllib.request.Request(site, headers={"User-Agent":"Mozilla/5.0 GT7Pitwall/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r: body=r.read(2_000_000).decode('utf-8','replace')
                  print("SITE", site, "LENGTH",len(body))
                  for needle in ["Daily Race A","Race A","SUGO International", "26 October 2026","__NEXT_DATA__"]:
                      m=re.search(re.escape(needle),body,re.I)
                      if m: print("MATCH",needle,html.unescape(body[max(0,m.start()-250):m.start()+900]).replace(chr(10),' ')[:1150])
              except Exception as e: print("SITE ERROR",site, type(e).__name__,str(e)[:200])
          PY

      - name: Cache de la bibliothèque DAVE (arm64)
        id: dave-cache
        uses: actions/cache@v4
        with:
          path: app/build/dave-natives
          key: dave-android-arm64-${{ hashFiles('scripts/build-dave-android.sh') }}

      - name: Compiler DAVE (libdave-jvm) pour Android arm64 depuis les sources
        if: steps.dave-cache.outputs.cache-hit != 'true'
        run: |
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          bash scripts/build-dave-android.sh app/build/dave-natives

      - name: Compiler l'APK debug
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GT7-Pitwall-debug-${{ github.run_number }}.apk"

      - name: Publier l'APK dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Pitwall-debug-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: core/build/reports/tests/
          if-no-files-found: ignore
