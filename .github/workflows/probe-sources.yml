name: Sonde des sources Sport (temporaire)

on:
  push:
    paths:
      - .github/workflows/probe-sources.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conditions d'utilisation
        run: |
          for u in https://gtsh-rank.com/terms/ https://www.gtplanet.net/terms/ https://www.gtplanet.net/forum/help/terms/; do
            echo "===== $u"
            curl -sSL -m 20 -A "GT7Pitwall/0.8" -o t.html -w "%{http_code}\n" "$u" || true
            python3 - <<'PY' || true
          import re, html
          s = open("t.html", encoding="utf-8", errors="replace").read()
          s = re.sub(r"(?s)<script.*?</script>|<style.*?</style>", " ", s)
          txt = html.unescape(re.sub(r"<[^>]+>", "\n", s))
          lines = [l.strip() for l in txt.splitlines() if l.strip()]
          keep = [l for l in lines if re.search(r"(?i)rss|feed|scrap|automat|robot|crawl|reproduc|copy|bot|data|extract|commercial|personal", l)]
          print("\n".join(keep[:60]))
          PY
          done
